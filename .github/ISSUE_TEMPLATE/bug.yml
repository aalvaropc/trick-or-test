name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest project or command sequence that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: trick-or-test, Node.js and test runner versions.
      placeholder: trick-or-test 0.1.0, Node.js 26.13.1, Vitest 5.1.0
    validations:
      required: true
